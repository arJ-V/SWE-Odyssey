[project]
name = "odyssey"
version = "0.1.0"
description = "SWE-Odyssey v0 tooling: compile ticket sequences into Harbor multi-step tasks, validate them, account and analyse runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
odyssey = "odyssey.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odyssey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the checkout even when the editable install's .pth is
# skipped (Python on macOS ignores .pth files carrying the "hidden" flag).
pythonpath = ["."]
