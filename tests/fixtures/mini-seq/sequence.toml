# Minimal 3-ticket sequence used by the unit tests (shell only, no runtime deps).
schema = 1

[sequence]
id = "mini-seq"
description = "Three independent defects in two tiny shell libraries"
workdir = "/app"
memory_dir = "/memory"
repo_memory_files = ["CLAUDE.md", "AGENTS.md", "NOTES.md"]
agent_timeout_sec = 600
verifier_timeout_sec = 120

[environment]
context = "environment"
base_tree = "environment/base"
cpus = 1
memory_mb = 1024
storage_mb = 2048
allow_internet = true

[[tickets]]
id = "MINI-1"
title = "add() subtracts"
cluster = "math"
role = "core"

[[tickets]]
id = "MINI-2"
title = "mul() adds"
cluster = "math"
role = "core"

[[tickets]]
id = "MINI-3"
title = "shout() does not upper-case"
cluster = "text"
role = "isolated"
