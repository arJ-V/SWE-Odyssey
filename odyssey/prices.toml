# SWE-Odyssey frozen price sheet (used for Standardized Dollar Cost, SDC).
#
# FROZEN: do not edit prices in place once a pilot has started. If list prices change,
# add a new sheet (prices-YYYY-MM-DD.toml) and pass it with --prices, so every SDC number
# in a report can be traced to one dated sheet.
#
# Units: USD per million tokens, standard (non-batch, non-priority, global-routing) tier.
#   input          uncached ("fresh") input tokens
#   cache_write    tokens written to the prompt cache, default TTL
#                  (Anthropic: 5-minute write; OpenAI GPT-5.6: 30-minute write)
#   cache_write_1h Anthropic 1-hour TTL write (used only when the trajectory records the
#                  ephemeral_1h split); OpenAI 12-hour write is listed in notes only
#   cache_read     cache hits / refreshes
#   output         output tokens, including reasoning/thinking tokens
#
# [models."<id>".long_context] holds the prices that apply to the WHOLE request when its
# prompt (all input tokens incl. cache reads and writes) exceeds threshold_tokens.
#
# verified = true means every number in the entry was read on the cited official page on
# the retrieval date. Fields named in unverified_fields are our assumption, not a listed
# price.

[meta]
sheet_date = "2026-11-10"
currency = "USD"
unit = "per_million_tokens"

# ---------------------------------------------------------------- Anthropic
# Source table: "Model pricing" and "Long context pricing" on the pricing page.
# Data residency (inference_geo="us") would multiply every category by 1.1x; not applied.

[models."claude-opus-5-5"]
provider = "anthropic"
input = 4.00
cache_write = 5.00
cache_write_1h = 8.00
cache_read = 0.20
output = 20.00
source = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved = "2026-11-10"
verified = true
notes = "1M context at standard pricing (no long-context surcharge). Cache reads are 0.05x input. Fast mode ($8/$40) not used."

[models."claude-sonnet-5-5"]
