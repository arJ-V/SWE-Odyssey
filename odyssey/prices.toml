# ---------------------------------------------------------------- Amazon Bedrock (open-weight models)
# Keys are the Bedrock model or inference-profile ids the harness is
# given (`openai/<id>` on Bedrock's OpenAI-compatible endpoint; accounting drops the
# `openai/` prefix). Standard tier, US regions; an inference profile's prefix matters
# because us. (US CRIS) and global. profiles are priced differently.
# Where the page lists no cache prices the model has no prompt caching on Bedrock
# (measured 2026-11-10: a repeated 8K-token prompt reported no cached tokens for
# zai.glm-5 and minimax.minimax-m2.5, and 8,098 cached tokens for us.moonshotai.kimi-k3);
# cache_read and cache_write are then set to the input price and listed as unverified.
# In full runs the OpenAI-compatible endpoint did report `cached_tokens` for zai.glm-5 and
# minimax.minimax-m2.5, but Bedrock's own CloudWatch meter counted every prompt token as
# InputTokenCount and none as CacheReadInputTokenCount, so pricing them at the input
# price matches what Bedrock metered.
# Kimi on Bedrock reported cache_write_tokens = 0 on a cache-filling call; the listed
# write price is kept for completeness.

[models."us.moonshotai.kimi-k3"]
provider = "bedrock"
input = 3.30
cache_write = 4.125
cache_read = 0.33
output = 16.50
source = "https://aws.amazon.com/bedrock/pricing/"
retrieved = "2026-11-10"
verified = true
notes = "Listed as 'Kimi 3', US CRIS, Standard tier. Global CRIS (global.moonshotai.kimi-k3) is $3.00 / $15.00 / $0.30 / $3.75."

