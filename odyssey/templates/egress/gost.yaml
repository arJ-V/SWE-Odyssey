# Written by `odyssey compile --egress allowlist` (docs/SPEC.md section 11).
# Bind-mounted over the gost config of Harbor 0.22's egress-control sidecar
# (harbor/environments/docker/harbor-docker-egress-control-sidecar/gost.yaml).
# Everything from `services:` to the end of `bypasses:` is Harbor's file
# verbatim (tests/test_egress.py checks it against the installed Harbor); the
# only addition is the `log` block, which records every allowed and denied
# connection in the sidecar's own filesystem, where the agent cannot reach it.
# Harbor collects it as an artifact after every step.
#
# addr, so_mark, and file.path must stay in sync with the constants in
# bin/network-policy (GOST_PORT, GOST_MARK, ALLOWLIST); the `reload` interval
# must stay below RELOAD_WAIT there.
services:
  - name: transparent-egress
    addr: ":12345"
    bypass: allowlist
    metadata:
      so_mark: 114514
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: true
    listener:
      type: red

bypasses:
  - name: allowlist
    whitelist: true
    reload: 1s
    file:
      path: /opt/egress-sidecar/allowlist.txt

log:
  output: /var/log/odyssey-egress.jsonl
  level: debug
  format: json
