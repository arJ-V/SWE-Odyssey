# ATL-3: atlas-specific ticket settings (contract: AUTHORING.md). Title, cluster and role are in
# sequence.toml.

[ticket]
kind = "policy"
# This ticket is one role's policy.
agent_timeout_sec = 1800
verifier_timeout_sec = 300

[reference]
# After gold.patch is applied to /app: python3 deploy/deploy.py --component <each>
deploy = ["orders_core"]

[grading]
# Test names as they appear in the JUnit reports (atlas_run.py). The wildcard-role guard runs
# after pytest passes and is reported under "other".
fail_to_pass = [
    "test_consumer_role_has_required_trust_and_scoped_permissions",
    "test_consumer_role_policy_matches_repository",
]
pass_to_pass = [
    "test_lambda_and_esm_exist",
    # Added by the validity verifier (2026-11-11): passes at every start state (the base role has
    # only the basic-execution logs policy); fails a role that gets its queue grants on "*".
    "test_consumer_role_queue_and_table_grants_name_their_resources",
]

# Known-bad variants: gold.patch-style patches against the base tree, deployed like the reference.
[[known_bad]]
name = "adds-cmv"
patch = "known_bad/adds-cmv.patch"
evidence = "a documented model failure of the IAM role-scope check; this variant is the reference plus sqs:ChangeMessageVisibility on orders.fifo, which test_consumer_role_has_required_trust_and_scoped_permissions forbids"
must_fail = ["test_consumer_role_has_required_trust_and_scoped_permissions"]

[[known_bad]]
name = "sqs-wildcard"
patch = "known_bad/sqs-wildcard.patch"
evidence = "over-broad grant: sqs:* on orders.fifo (covers ChangeMessageVisibility through the wildcard)"
must_fail = ["test_consumer_role_has_required_trust_and_scoped_permissions"]

[[known_bad]]
name = "not-deployed"
patch = "known_bad/not-deployed.patch"
evidence = "the reference policy committed but never deployed (deploy.py not run), so the live role is unchanged"
deploy = []
must_fail = ["test_consumer_role_has_required_trust_and_scoped_permissions",
             "test_consumer_role_policy_matches_repository"]

[[known_bad]]
name = "policy-in-code"
patch = "known_bad/policy-in-code.patch"
evidence = "the right grants, but hard-coded in deploy/components/orders_core.py instead of the repository's iam/orders-consumer-role.json, against the ticket's stated convention"
must_fail = ["test_consumer_role_policy_matches_repository"]

[[known_bad]]
name = "managed-sqs-exec-role"
patch = "known_bad/managed-sqs-exec-role.patch"
evidence = "validity verifier, 2026-11-11: the AWS-managed AWSLambdaSQSQueueExecutionRole attached for the queue (sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes on Resource '*', no ChangeMessageVisibility) and a table-only iam/orders-consumer-role.json; scored 1 before the resource-scope check was added"
must_fail = ["test_consumer_role_queue_and_table_grants_name_their_resources"]
